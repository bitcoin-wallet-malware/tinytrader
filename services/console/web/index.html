  --bg: #FFFFFF; --surface: #F6F6F6; --line: #D9D9D9; --line-soft: #EBEBEB; --nav-bg: #FAFAFA; --nav-hover: rgba(0, 0, 0, .05);
  --fg: #111111; --fg-2: #333333; --muted: #6B6B6B;
  --accent: #111111; --accent-mark: #111111; --accent-2: #8A8A8A; --accent-soft: #EBEBEB;
  --ok: #17704F; --ok-soft: #E5F4ED;
  --warn: #A3500C; --warn-mark: #E8862A; --warn-soft: #FDF1E4; --warn-line: #F2C9A0;
  --crit: #A5232F; --crit-mark: #C8363F; --crit-soft: #FBECEE; --crit-line: #E9B9BF;
  --idle: #555555; --idle-soft: #EFEFEF;
  --grid: #EBEBEB; --up: #1E8A5A; --down: #C8363F;
  --sans: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --mono: 'Inconsolata', ui-monospace, 'SF Mono', Menlo, monospace;
  /* The interface is monospace, after tinygrad; long reading stays proportional. */
  --ui: var(--mono);
  --link: var(--fg);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E0E0E; --surface: #171717; --line: #2E2E2E; --line-soft: #1F1F1F; --nav-bg: #121212; --nav-hover: rgba(255, 255, 255, .06);
  --fg: #EDEDED; --fg-2: #C4C4C4; --muted: #8F8F8F;
  --accent: #F2F2F2; --accent-mark: #DADADA; --accent-2: #8F8F8F; --accent-soft: #262626;
  --ok: #72CFA5; --ok-soft: #13291F;
  --warn: #F2A660; --warn-mark: #E8862A; --warn-soft: #2C1E10; --warn-line: #5C3E1F;
  --crit: #F29AA3; --crit-mark: #E0606A; --crit-soft: #2F171B; --crit-line: #5E2B32;
  --idle: #ABABAB; --idle-soft: #222222;

} }

  --ok: #72CFA5; --ok-soft: #13291F;

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--ui); }
/* Scroll bars in the theme: thin, a muted thumb (full on hover), no track. */
:root { --scroll-thumb: color-mix(in srgb, var(--muted) 45%, transparent); }
* { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
/* Dockview is set up with its light theme (for its sizes) and marks its panels light: they follow the page's scheme instead, so native scroll bars match dark themes too. */
.dockview-theme-light, .dockview-theme-light * { color-scheme: inherit !important; }
.prose, .story p { font-family: var(--sans); }
h1, h2 { text-wrap: balance; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
button:focus-visible, a:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.home { display: inline-flex; align-items: center; color: var(--fg); text-decoration: none; border-radius: 4px; padding: 4px 2px; }
.home:hover { color: var(--accent); }
/* The wordmark is drawn from a 5-row bitmap font as squares, so it stays crisp. */
.wordmark { display: block; height: 25px; width: auto; }

.icon-btn { width: 46px; height: 46px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface); }

/* Earnings */

.ew-sym { font: 800 15px var(--mono, ui-monospace, monospace); letter-spacing: -.01em; }
.ew-name { font: 11px var(--ui); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ew-cap { font: 600 11px var(--ui); font-variant-numeric: tabular-nums; }

.ew-chip, .ew-more { font: 600 11px var(--mono, ui-monospace, monospace); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg, var(--surface)); color: inherit; cursor: pointer; }

.ew-tile:hover, .ew-chip:hover, .ew-more:hover { background: var(--nav-hover); }
.ew-more { font-weight: 400; color: var(--muted); }
.ew-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 11px var(--ui); color: var(--muted); padding-top: 6px; border-top: 1px solid var(--line); }
.er-wrap { overflow: auto; margin-top: 8px; }
.er { width: 100%; border-collapse: collapse; font: 12px var(--mono); font-variant-numeric: tabular-nums; }
.er th { text-align: left; font: 600 11px var(--ui); color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: help; }

.er-row { cursor: pointer; } .er-row:hover, .er-row.open { background: var(--nav-hover); }

.er-detail td { background: var(--surface); white-space: normal; }
.er-detail-in p { margin: 4px 0 8px; font: 13px var(--ui); }
.er-bars { display: flex; flex-direction: column; gap: 3px; }
.er-bar { display: grid; grid-template-columns: 10.5em minmax(80px, 1fr) 5em minmax(0, 1.4fr); gap: 8px; align-items: center; }
.er-track { position: relative; height: 10px; background: var(--line-soft); border-radius: 2px; }
.er-track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
.er-track i.up { background: var(--ok); } .er-track i.down { background: var(--crit); }

.tile-body:has(> .nb) { padding: 0; }
.nb { display: flex; flex-direction: column; width: 100%; height: 100%; }
.nb-bar { display: flex; justify-content: space-between; gap: 12px; margin: 0; padding: 4px 10px; font-size: 12px; border-bottom: 1px solid var(--line-soft); }
.nb-frame { flex: 1 1 auto; width: 100%; border: 0; background: #fff; }
/* Watchlist */
.wl { width: 100%; border-collapse: collapse; font: 13px var(--mono); font-variant-numeric: tabular-nums; }
.wl th { text-align: left; font: 600 11px var(--ui); letter-spacing: .04em; color: var(--muted); padding: 4px 8px; border-bottom: 1px solid var(--line); }
.wl td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); }

.wl tbody tr { cursor: pointer; } .wl tbody tr:hover { background: var(--nav-hover); }
.wl tr[aria-current] { background: var(--accent-soft); } .wl .wl-sym { font-weight: 600; }
.wl:focus { outline: none; } .wl:focus tr[aria-current] { box-shadow: inset 2px 0 0 var(--accent); }
.wl-bell { margin-left: 6px; padding: 0 2px; border: 0; background: none; color: var(--muted); font-size: 10px; cursor: pointer; opacity: .35; vertical-align: 1px; }
.wl tr:hover .wl-bell, .wl-bell.set, .wl-bell.fired { opacity: 1; } .wl-bell.set { color: var(--accent); } .wl-bell.fired { color: var(--warn, #b26a00); }

.al-form p { flex: 1 1 100%; margin: 0; font-size: 11px; }
.wl-foot { font-size: 12px; margin: 8px 0 0; }
.nw-pop h3 { margin: 6px 10px 8px; font: 600 13px var(--ui); color: var(--muted); }
.nw-item { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); font: 14px var(--ui); text-align: left; cursor: pointer; }
.wm-confirm { display: flex; gap: 8px; justify-content: flex-end; padding: 4px 10px 8px; }
.nw-item span { font-size: 12px; color: var(--muted); }
.nw-item:hover, .nw-item[aria-selected="true"] { background: var(--accent-soft); }
.bell-wrap { position: relative; }
.bell { position: relative; }
.bell-n { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--warn-mark); color: var(--bg); font: 700 10px/16px var(--ui); text-align: center; }
.bell-n.crit { background: var(--crit-mark); }
.bell-pop { position: fixed; right: 16px; z-index: 50; width: min(380px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); box-shadow: 0 10px 30px rgba(0, 0, 0, .18); padding: 6px; }

.bell-item { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 4px 10px; align-items: baseline; width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); font: 14px var(--ui); text-align: left; cursor: pointer; }
.bell-item:hover { background: var(--nav-hover); }
.bell-item i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn-mark); } .bell-item i.crit { background: var(--crit-mark); }
.bell-item span { grid-column: 2; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.bell-none { margin: 8px 10px 10px; color: var(--muted); font-size: 14px; }
.wtab-wl { margin-left: 8px; max-width: 130px; font: 12px var(--ui); padding: 2px 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--fg-2); }
.wtab-al { margin-left: 4px; font-size: 12px; } .wtab-al.on { color: var(--accent); }
.tk-pop { position: fixed; z-index: 70; width: min(370px, calc(100vw - 16px)); box-shadow: 0 12px 32px rgb(0 0 0 / .22); border-radius: 8px; }
.tk-pop .al-form { margin: 0; }
.bell-price { cursor: default; } .bell-price.new { background: var(--accent-soft); } .bell-price .chip-btn { margin-left: 6px; }

#nav-layouts kbd { margin-left: auto; font: 11px var(--mono); color: var(--muted); font-weight: 400; }
#nav-layouts .nav-new { color: var(--muted); font-weight: 500; }
/* Workspaces are tabs in the header; the sidebar only appears on the docs pages. */
body:not(.docs-mode) .nav { display: none; }
.brand { flex-wrap: nowrap; gap: 18px; min-width: 0; flex: 1 1 auto; }
/* The side pane: workspaces as a tree of folders, sliding over the workspace
   from the left when opened (⌥B); the panels under it stay where they are. */
.wsnav { display: flex; flex-direction: column; position: fixed; left: 0; top: var(--top-h, 67px); bottom: 0; width: 260px; z-index: 30; overflow-y: auto; background: var(--nav-bg); border-right: 1px solid var(--line); box-shadow: 8px 0 24px rgb(0 0 0 / .16); font-size: 13px;
  transform: translateX(-100%); visibility: hidden; transition: transform .18s ease, visibility 0s linear .18s; }
body.wsn-open .wsnav { transform: none; visibility: visible; transition: transform .18s ease; }
@media (prefers-reduced-motion: reduce) { .wsnav, body.wsn-open .wsnav { transition: none; } }
.wsn-btn[aria-expanded="true"] { color: var(--accent); }
.wsn-head { display: flex; align-items: center; gap: 6px; padding: 10px 8px 6px 12px; position: sticky; top: 0; background: var(--nav-bg); z-index: 1; }
.wsn-head b { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

.wsn-row:hover { background: var(--nav-hover); color: var(--fg); }
.wsn-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wsn-ws.current { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.wsn-folder { font-weight: 600; } .wsn-folder em { font-style: normal; color: var(--muted); font-weight: 400; font-size: 11px; }
.wsn-dot { width: 14px; flex: none; } .wsn-dot::before { content: ""; display: block; width: 6px; height: 6px; margin-left: 3px; border-radius: 50%; border: 1px solid var(--muted); } .wsn-ws.current .wsn-dot::before { background: var(--accent); border-color: var(--accent); }
.wsn-ws em { font-style: normal; color: var(--muted); font-size: 11px; }
.wtab-hint { margin-left: 10px; font-size: 12px; white-space: normal; }
.wsn-tw { width: 14px; flex: none; padding: 0; border: 0; background: none; color: var(--muted); font-size: 10px; cursor: pointer; text-align: left; }
.wsn-panel { min-height: 24px; font-size: 12px; color: var(--muted); }
.wsn-panel::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--muted); }
.wsn-panel.on { color: var(--fg); } .wsn-panel.on::before { background: var(--accent); border-color: var(--accent); }
.wsn-acts { display: none; gap: 2px; margin-left: auto; } .wsn-row:hover .wsn-acts, .wsn-acts.on { display: inline-flex; }
.wsn-acts button { width: 22px; height: 22px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1; }
.wsn-acts button:hover { background: var(--bg); color: var(--fg); }
.wsn-confirm { flex-wrap: wrap; gap: 6px; padding-block: 6px; cursor: default; background: var(--crit-soft); color: var(--fg); }
.wsn-confirm span { flex: 1 1 100%; }
.wsn-ws .wsn-acts button { font-size: 14px; }
.wsn-in { flex: 1; min-width: 0; font: 13px var(--ui); padding: 3px 6px; border: 1px solid var(--accent-2); border-radius: 4px; background: var(--surface); color: var(--fg); }
.wsnav:focus-within .wsn-row[data-sel] { box-shadow: inset 0 0 0 1.5px var(--accent-2); } .wsn-row:focus { outline: none; }
.wsnav .drop { outline: 2px dashed var(--accent-mark); outline-offset: -2px; }
.wsn-opt { margin: auto 0 0; padding: 10px 12px; border-top: 1px solid var(--line-soft); font-size: 11px; color: var(--muted); }
.navcard { position: fixed; z-index: 60; top: calc(var(--top-h, 67px) + 10px); left: 50%; transform: translateX(-50%); min-width: 240px; max-width: min(420px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--nav-bg); box-shadow: 0 12px 32px rgb(0 0 0 / .22); font-size: 13px; pointer-events: none; }

.nav-i kbd { margin-left: auto; font: 11px var(--ui); color: var(--muted); }

@media (max-width: 700px) {

}

.tp-find { display: contents; } .tp-sym { width: 8ch; font: 600 12px var(--mono); text-transform: uppercase; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--fg); }
.tp-last { font-size: 17px; padding: 1px 6px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.tp-stats { display: contents; } .tp-stats i, .tp i { font-style: normal; opacity: .5; padding: 0 2px; }
.tp-split { display: inline-block; width: 64px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--crit, #c62828); } .tp-split i { display: block; height: 100%; padding: 0 !important; opacity: 1 !important; background: var(--ok, #1a7f37); }
.tp-share { color: var(--fg-2); }
.tp-ctl { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; } .tp-ctl .tile-btn { font: 600 11px var(--ui); } .tp-ctl .tile-btn[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.tp-list { flex: 1 1 auto; min-height: 120px; overflow-y: auto; }
.tp { width: 100%; max-width: 420px; border-collapse: collapse; font: 12px/1.15 var(--mono); font-variant-numeric: tabular-nums; }
.tp td { padding: 1px 8px; white-space: nowrap; color: var(--fg-2); } .tp .num { text-align: right; } .tp small { font-size: 10px; color: var(--muted); }
.tp tr > td:first-child { box-shadow: inset 2px 0 0 transparent; }
.tp-buy td:not(:first-child) { color: var(--ok, #1a7f37); } .tp-buy > td:first-child { box-shadow: inset 2px 0 0 var(--ok, #1a7f37); }
.tp-sell td:not(:first-child) { color: var(--crit, #c62828); } .tp-sell > td:first-child { box-shadow: inset 2px 0 0 var(--crit, #c62828); }
.tp-big td { font-weight: 700; } .tp-big.tp-buy td { background: color-mix(in srgb, var(--ok, #1a7f37) 12%, transparent); } .tp-big.tp-sell td { background: color-mix(in srgb, var(--crit, #c62828) 12%, transparent); }
.tp-q td { color: var(--muted); font-size: 11px; }
/* Ticks flash as they arrive, and the last price on a change, as on a terminal. */
@keyframes tp-flash-buy { from { background: color-mix(in srgb, var(--ok, #1a7f37) 45%, transparent); } }
@keyframes tp-flash-sell { from { background: color-mix(in srgb, var(--crit, #c62828) 45%, transparent); } }
@keyframes tp-flash-mid { from { background: color-mix(in srgb, var(--fg) 22%, transparent); } }
@keyframes tp-flash-q { from { background: color-mix(in srgb, var(--accent) 9%, transparent); } }
.tp-new td { animation: tp-flash-mid 1.2s ease-out both; animation-delay: inherit; }
.tp-new.tp-buy td { animation-name: tp-flash-buy; } .tp-new.tp-sell td { animation-name: tp-flash-sell; } .tp-new.tp-q td { animation-name: tp-flash-q; }
.tp-last.tp-up { animation: tp-flash-buy .9s ease-out; color: var(--ok, #1a7f37); } .tp-last.tp-down { animation: tp-flash-sell .9s ease-out; color: var(--crit, #c62828); }
@media (prefers-reduced-motion: reduce) { .tp-new td, .tp-last.tp-up, .tp-last.tp-down { animation: none; } }
.tp-foot { margin: 0; font-size: 11px; }
